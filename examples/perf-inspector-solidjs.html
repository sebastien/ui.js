<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UI.js - Perf Inspector (SolidJS)</title>
	<link rel="stylesheet" href="../src/css/ui.css" type="text/css" media="all" />
</head>

<body>
	<div id="Inspector"></div>

	<script type="module">
		import { render } from "https://cdn.skypack.dev/solid-js/web";
		import h from "https://cdn.skypack.dev/solid-js/h";

		const getType = (value) =>
			value === undefined || value === null
				? "undefined"
				: value instanceof Map
					? "map"
					: value instanceof Array
						? "array"
						: typeof value;

		const entriesOf = (value) => {
			if (value instanceof Map) {
				return Array.from(value.entries());
			}
			if (value instanceof Array) {
				return value.map((entry, index) => [index, entry]);
			}
			if (value && typeof value === "object") {
				return Object.entries(value);
			}
			return [];
		};

		function Inspector({ value }) {
			const type = getType(value);
			switch (type) {
				case "object":
				case "map":
					return h(
						"ul",
						{ className: "comma curlies dim-ab" },
						...entriesOf(value).map(([key, entryValue]) =>
							h(
								"li",
								{ className: "pl-2" },
								h("span", { className: "mono dim small" }, `${key}:`),
								" ",
								Inspector({ value: entryValue })
							)
						)
					);
				case "array":
					return h(
						"ul",
						{ className: "comma brackets dim-ab" },
						...entriesOf(value).map(([index, entryValue]) =>
							h(
								"li",
								{ className: "pl-2" },
								h("span", { className: "mono dim small" }, `#${index}:`),
								" ",
								Inspector({ value: entryValue })
							)
						)
					);
				default:
					return h("span", {}, `${value}`);
			}
		}

		const logs = await fetch("inspector-speed.json").then((_) => _.json());

		render(() => Inspector({ value: { logs } }), document.getElementById("Inspector"));
	</script>
</body>

</html>
